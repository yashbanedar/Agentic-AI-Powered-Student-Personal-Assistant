databases:
  - name: student-ai-db
    databaseName: student_assistant
    user: student_admin
    plan: free
    region: oregon

services:
  - type: web
    name: student-ai-assistant
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: student-ai-db
          property: connectionString
